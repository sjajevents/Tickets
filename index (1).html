<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Crystal Masquerade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #062354;
    --ink: #173d59;
    --ice: #eaf5fd;
    --frost: #c1dcec;
    --accent: #185c8a;
    --ok: #23783e;
    --used: #ae5a10;
    --bad: #af2929;
    --serif: "Cinzel", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #dcedf9 0%, var(--ice) 45%, #f7fbfe 100%);
    color: var(--ink);
    font: 18px/1.6 var(--sans);
    padding: 24px 16px 48px;
  }
  main {
    max-width: 460px;
    margin: 16px auto 0;
    background: #fff;
    border: 1px solid var(--frost);
    border-radius: 20px;
    padding: 28px 24px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(6, 35, 84, 0.08);
  }
  .event { font: 700 22px/1.3 var(--serif); color: var(--navy); margin: 0; letter-spacing: .02em; }
  .info { font-size: 15px; color: #4a6a80; margin: 6px 0 0; }
  .status { font: 600 26px/1.3 var(--sans); margin: 26px 0 4px; }
  .ready .status { color: var(--navy); }
  .success .status { color: var(--ok); }
  .used .status { color: var(--used); }
  .invalid .status, .error .status { color: var(--bad); }
  .number { font: 700 44px/1.1 var(--serif); color: var(--navy); margin: 14px 0 4px; }
  .name { font-size: 22px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .meta { color: #4a6a80; margin: 2px 0 0; }
  .note { font-size: 15px; color: #4a6a80; margin: 22px 0 0; }
  .detail { margin: 8px 0 0; }
  section.staff {
    border-top: 1px solid #d9e8f1;
    margin-top: 26px;
    padding-top: 14px;
    text-align: left;
  }
  section.staff h2 { font-size: 18px; margin: 0 0 8px; color: var(--navy); }
  label { display: block; font-weight: 600; font-size: 16px; }
  input[type=password] {
    display: block; width: 100%;
    font: 24px var(--sans); letter-spacing: .3em;
    padding: 12px 14px; margin: 6px 0 14px;
    border: 1px solid #a8c5d8; border-radius: 10px; background: #fff; color: var(--ink);
  }
  .remember { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 14px; line-height: 1.5; margin: 4px 0 16px; }
  .remember input { margin-top: 4px; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font: 600 18px var(--sans); cursor: pointer;
  }
  button.secondary { background: #eef5fa; color: #235779; margin-top: 12px; font-size: 14px; font-weight: 400; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid #7fb4d6; outline-offset: 2px; }
  #result { font-weight: 600; margin: 14px 0 0; min-height: 1.6em; }
  [hidden] { display: none !important; }
  .spinner {
    width: 34px; height: 34px; margin: 26px auto 8px;
    border: 4px solid var(--frost); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
</style>
</head>
<body>
<main id="card" class="loading">
  <p class="event" id="eventName">The Crystal Masquerade</p>
  <p class="info" id="eventInfo">December 12, 2026 | 08:00 PM | Adib Palace, Skyhall - Rayfoun</p>

  <div id="loading"><div class="spinner" aria-hidden="true"></div><p>Loading your ticket…</p></div>

  <div id="ticket" hidden>
    <h1 class="status" id="statusTitle"></h1>
    <p class="number" id="ticketNumber"></p>
    <p class="name" id="guestName"></p>
    <p class="meta" id="guestMeta"></p>
    <p class="detail" id="detail"></p>
  </div>

  <div id="problem" hidden>
    <h1 class="status" id="problemTitle"></h1>
    <p id="problemText"></p>
    <button id="retry" type="button" hidden>Try again</button>
  </div>

  <p class="note" id="note" hidden>Opening this page does not check you in. Please show your ticket to entrance staff.</p>

  <section class="staff" id="staff" aria-label="Entrance staff" hidden>
    <h2>Entrance staff</h2>
    <form id="staffForm">
      <div id="pinField">
        <label for="pin">Staff PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" autocomplete="off" placeholder="•••">
      </div>
      <p id="remembered" hidden>Staff access is remembered on this device.</p>
      <label class="remember"><input id="remember" type="checkbox"> Remember staff access on this device for 12 hours</label>
      <button id="checkButton" type="submit">Check in</button>
    </form>
    <button id="forget" type="button" class="secondary">Forget staff access on this device</button>
    <p id="result" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  'use strict';

  // ====== FILL IN THESE TWO VALUES BEFORE UPLOADING ======
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbzYZba1luwq1La49y8HE2hxW4ysael6c9JFEpSVwbxW8aMC2AW_Bjv84unHli_TGELVJA/exec';        // your Apps Script web app link ending in /exec
  var BRIDGE_SECRET = '661bcd322ae647ba8b57f0a266507dc5f247857cf9364183ba023c9e18d022d0'; // printed by connectGithubTicketPage
  // =======================================================

  var STORAGE_KEY = 'crystalMasqueradeStaffSession';
  var token = (new URLSearchParams(window.location.search).get('t') || '').trim().toLowerCase();
  var staffSession = '';
  try { staffSession = localStorage.getItem(STORAGE_KEY) || ''; } catch (e) {}

  function $(id) { return document.getElementById(id); }

  function setState(cls) { $('card').className = cls; }

  function show(which) {
    ['loading', 'ticket', 'problem'].forEach(function (id) { $(id).hidden = id !== which; });
  }

  function api(body) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 25000);
    var payload = Object.assign({ bridgeSecret: BRIDGE_SECRET }, body);
    // text/plain keeps this a simple request, so the browser sends no preflight.
    return fetch(EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      signal: controller.signal
    }).then(function (res) {
      return res.json();
    }).finally(function () { clearTimeout(timer); });
  }

  function problem(cls, title, text, canRetry) {
    setState(cls);
    show('problem');
    $('problemTitle').textContent = title;
    $('problemText').textContent = text;
    $('retry').hidden = !canRetry;
    $('note').hidden = true;
    $('staff').hidden = true;
  }

  function render(data) {
    if (data.event) $('eventName').textContent = data.event;
    if (data.eventInfo) $('eventInfo').textContent = data.eventInfo;
    var used = data.code === 'ALREADY_USED';
    setState(used ? 'used' : 'ready');
    show('ticket');
    $('statusTitle').textContent = used ? 'Already used' : 'Your ticket';
    $('ticketNumber').textContent = 'No. ' + (data.number || '');
    $('guestName').textContent = data.name || '';
    $('guestMeta').textContent = [data.unit, data.guestType].filter(Boolean).join(' · ');
    $('detail').textContent = used && data.checkedInAt ? 'Checked in at ' + data.checkedInAt : '';
    $('note').hidden = false;
    $('staff').hidden = false;
    updateStaffFields();
  }

  function load() {
    if (!/^[a-f0-9]{32}$/.test(token)) {
      problem('invalid', 'Invalid ticket', 'This link is missing a valid ticket code. Scan the QR code on your ticket again.', false);
      return;
    }
    if (EXEC_URL.indexOf('https://script.google.com/macros/s/') !== 0) {
      problem('error', 'Page not set up', 'The organizer still needs to add the ticket service link to this page.', false);
      return;
    }
    setState('loading');
    show('loading');
    api({ action: 'preview', token: token }).then(function (data) {
      if (data && (data.code === 'READY' || data.code === 'ALREADY_USED')) {
        render(data);
      } else if (data && data.code === 'INVALID') {
        problem('invalid', 'Invalid ticket', 'This ticket could not be found. Check that you opened the latest email.', false);
      } else {
        problem('error', 'Cannot load ticket', 'The ticket service did not answer correctly. Try again in a moment.', true);
      }
    }).catch(function () {
      problem('error', 'Cannot load ticket', 'Check your internet connection, then try again. Entrance staff can also find your ticket by name.', true);
    });
  }

  function updateStaffFields() {
    $('pinField').hidden = Boolean(staffSession);
    $('remembered').hidden = !staffSession;
    $('remember').checked = Boolean(staffSession);
  }

  function forgetStaff() {
    staffSession = '';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    updateStaffFields();
    $('pin').value = '';
  }

  $('retry').addEventListener('click', load);
  $('forget').addEventListener('click', forgetStaff);

  $('staffForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var button = $('checkButton');
    var result = $('result');
    var remember = $('remember').checked;
    var pin = $('pin').value;
    button.disabled = true;
    result.textContent = 'Checking ticket…';
    api({ action: 'checkIn', token: token, pin: pin, session: staffSession }).then(function (r) {
      button.disabled = false;
      result.textContent = (r && r.message) ? r.message : 'Unexpected answer. Retry.';
      $('pin').value = '';
      if (r && (r.code === 'PIN_REQUIRED' || r.code === 'WRONG_PIN')) forgetStaff();
      if (r && r.session && remember) {
        staffSession = r.session;
        try { localStorage.setItem(STORAGE_KEY, staffSession); } catch (e) {}
        updateStaffFields();
      } else if (!remember) {
        forgetStaff();
      }
      if (r && r.code === 'CHECKED_IN') {
        setState('success');
        $('statusTitle').textContent = 'Checked in';
      } else if (r && r.code === 'ALREADY_USED') {
        setState('used');
        $('statusTitle').textContent = 'Already used';
      }
    }).catch(function () {
      button.disabled = false;
      result.textContent = 'Could not confirm the result. Retry: the server checks whether this ticket was already used.';
    });
  });

  load();
})();
</script>
</body>
</html>
